<!-- SLIDE cover | LANE testimonial | PHOTO none
     TOKENS:
       quote       : text           | the customer's words, verbatim, lightly trimmed — 1–3 sentences
       attribution : text           | first name + initial, e.g. "Darren L"
       kicker      : text, optional | whisper label above the quote, e.g. "Kind words"
     LEVERS:
       motif       : enum body-flower|face-1|face-2|hand-flower|hand-rose|front-face | the line-art figure behind the card — it emerges above and below (assets/lineart/*.svg, rendered as a CSS mask)
     VISUAL_ROLE  : a white card floating on an ink field with line-art figures (seed: Design 3)
     FOCAL        : the quote
     PALETTE       : ink #000000 field · white card · clay-tint line-art · clay kicker
     TYPE          : Lust quote + Neuzeit attribution/kicker. Chrome-free lane.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000;--ink:#000000;--clay:#D8CCBE;overflow:hidden}
/* black-stroke SVG as a stencil: mask = drawing, background-color = colourway.
   One large figure behind the card — it emerges in the bands above and below,
   the card owns the middle (seed 3's composition). */
.la{position:absolute;background:rgba(236,230,223,.42);top:-6%;bottom:-8%;right:-10%;width:80%;
    -webkit-mask:url('{{ASSETS_BASE}}/assets/lineart/{{motif}}.svg') center/contain no-repeat;
    mask:url('{{ASSETS_BASE}}/assets/lineart/{{motif}}.svg') center/contain no-repeat}
.card{position:absolute;left:10%;right:13%;top:17%;bottom:17%;background:#FFFFFF;
      padding:72px 64px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-family:SansB;font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:var(--clay);margin-bottom:24px}
.q{font-family:Lust;font-size:40px;line-height:1.32;color:var(--ink)}
.attr{font-family:SansB;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-top:40px}
/* story 9:16 — card sits inside the UI-safe band */
.stage.r9x16 .card{left:9%;right:9%;top:24%;bottom:26%}
.stage.r9x16 .q{font-size:44px}
.stage.r9x16 .la{top:-4%;bottom:-6%;right:-14%;width:94%}
/* landscape */
.stage.land .card{left:15%;right:15%;top:13%;bottom:13%;padding:56px 64px}
.stage.land .q{font-size:30px}
.stage.land .attr{margin-top:24px}
.stage.land .la{top:-10%;bottom:-12%;right:-4%;width:44%}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="la"></div>
  <div class="card">
    <div class="kicker">{{kicker}}</div>
    <div class="q">{{quote}}</div>
    <div class="attr">{{attribution}}</div>
  </div>
</div></body></html>
