<!-- SLIDE closing | LANE journal | PHOTO required
     TOKENS:
       voice       : text, markdown, optional | dark layout: brand sign-off line (Cervanttis voice line)
       cta         : text, optional  | dark layout: pill CTA, e.g. "Read the guide →"
       url         : text           | display URL, e.g. "figandbloom.com.au" (both layouts)
       photo       : image          | hero plate URL — same plate as the cover for continuity (dark: darkened; light: faint ground)
       kicker      : text, optional  | light layout: sans kicker, e.g. "The Point of View"
       headline    : text, markdown, optional | light layout: serif sign-off headline; _word_ = italic-Lust emphasis (use rarely); *word* = legacy roman accent; <br> for line breaks
       body        : text, optional  | light layout: a short sans paragraph
       avatar      : image, optional | light layout: author headshot (shown as a circle)
       author_name : text, optional  | light layout: author name, e.g. "Kellie"
       author_role : text, optional  | light layout: author role, e.g. "Co-founder, Fig & Bloom"
       read_label  : text, optional  | light layout: label above the URL, e.g. "Read the full entry"
     LEVERS:
       theme       : enum dark|light     | dark (default) = the centred sign-off over a moody plate; light = the author-card closer on a warm ground
       lockup      : enum wordmark|full  | wordmark (default) = Fig & Bloom only — For Moment Makers is a lens, not a slogan, and must not sit on the image; full = the current lockup with the tagline, for the rare case that wants it. Honoured on both the dark plate logo and the light author-card logo.
     PALETTE       : ink #000000 ground · white #FFFFFF type · clay-tint #ECE6DF secondary
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box;font-synthesis:none}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000 url('{{photo}}') center/cover no-repeat;--mx:120px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.col{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 var(--mx)}
.logo{margin-top:9.5%;height:110px;width:auto}
/* voice is the hero of the dark closer: oversized script, optically centred between the
   foot logo (top) and the CTA/URL (foot) so it fills the frame rather than reading as a
   top-anchored afterthought. A soft text-shadow lifts it off the plate for contrast. */
.voice{font-family:CervI;font-size:88px;line-height:1.22;max-width:900px;color:#FFFFFF;text-shadow:0 2px 34px rgba(0,0,0,.55)}
.voice:empty{display:none}
.spacer{flex:1}
.cpill{display:inline-block;border:2px solid #ECE6DF;border-radius:999px;padding:26px 64px;font-family:Sans;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:#ECE6DF}
.url{margin-top:48px;font-family:Sans;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#ECE6DF}
.tail{flex:0 0 12%}
/* square feed — tighter run */
.stage.r1x1 .logo{height:96px}
.stage.r1x1 .voice{font-size:80px}
.stage.r1x1 .url{margin-top:40px}
/* story 9:16 — story-scale type, clear of UI zones */
.stage.r9x16 .logo{margin-top:14%}
.stage.r9x16 .voice{font-size:100px;max-width:none}
.stage.r9x16 .url{font-size:26px}
.stage.r9x16 .tail{flex-basis:20%}

/* ---- light author-card layout (theme:light) — scoped; the dark layout above is untouched.
   A clean, solid warm surface (no photo ground) so the author card and type read crisply. ---- */
.lcol{display:none}
.stage[data-theme="light"]{background:#ECE6DF}
.stage[data-theme="light"] .ov{background:transparent}
.stage[data-theme="light"] .col{display:none}
.stage[data-theme="light"] .lcol{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;height:100%;padding:88px;--mx:88px}
.lkicker{font-family:Sans;font-size:26px;letter-spacing:.26em;text-transform:uppercase;color:#000000}
.lkrule{width:56px;height:2px;background:#000000;margin-top:22px}
.lh{margin-top:36px;font-family:Lust;font-size:64px;line-height:1.08;letter-spacing:-.5px;color:#000000}
.lh:empty{display:none}
.lh i{font-style:normal}
.lh em{font-style:italic;font-synthesis:style}
.lbody{margin-top:32px;max-width:820px;font-family:Sans;font-size:30px;line-height:1.5;color:rgba(0,0,0,.62)}
.lbody:empty{display:none}
.lbot{width:100%}
.lhair{height:1px;background:#D8CCBE;width:100%}
.author{display:flex;align-items:center;gap:28px;margin-top:40px}
.avatar{width:118px;height:118px;border-radius:999px;object-fit:cover;display:block;background:#D8CCBE}
.avatar[src=""],.avatar:not([src]){display:none}
.aname{font-family:Lust;font-size:38px;line-height:1.1;color:#000000}
.arole{margin-top:8px;font-family:Sans;font-size:24px;letter-spacing:.04em;color:rgba(0,0,0,.6)}
.read{margin-top:44px;font-family:Sans;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#000000}
.read:empty{display:none}
.lurl{margin-top:18px;font-family:Sans;font-size:24px;letter-spacing:.14em;color:rgba(0,0,0,.6)}
.llogo{margin-top:40px;height:64px;width:auto;display:block}
/* square feed */
.stage[data-theme="light"].r1x1 .lh{font-size:54px}
.stage[data-theme="light"].r1x1 .avatar{width:100px;height:100px}
/* story 9:16 */
.stage[data-theme="light"].r9x16 .lcol{padding:160px 88px}
.stage[data-theme="light"].r9x16 .lh{font-size:76px}
.stage[data-theme="light"].r9x16 .lbody{font-size:32px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}" data-theme="{{theme}}">
  <div class="ov"></div>
  <div class="col">
    <img class="logo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
    <div class="spacer"></div>
    <div class="voice">{{voice}}</div>
    <div class="spacer"></div>
    <span class="cpill">{{cta}}</span>
    <div class="url">{{url}}</div>
    <div class="tail"></div>
  </div>
  <div class="lcol">
    <div class="ltop">
      <div class="lkicker">{{kicker}}</div>
      <div class="lkrule"></div>
      <div class="lh">{{headline}}</div>
      <div class="lbody">{{body}}</div>
    </div>
    <div class="lbot">
      <div class="lhair"></div>
      <div class="author">
        <img class="avatar" src="{{avatar}}">
        <div class="ameta">
          <div class="aname">{{author_name}}</div>
          <div class="arole">{{author_role}}</div>
        </div>
      </div>
      <div class="read">{{read_label}}</div>
      <div class="lurl">{{url}}</div>
      <img class="llogo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
    </div>
  </div>
</div></body></html>
