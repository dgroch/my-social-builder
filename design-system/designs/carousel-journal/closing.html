<!-- SLIDE closing | LANE journal | PHOTO required (darkened)
     TOKENS:
       voice    : text, markdown | brand sign-off line (Cervanttis voice line) (e.g. "For the moment they feel what you meant.")
       cta      : text           | pill CTA, e.g. "Read the guide →"
       url      : text           | display URL, e.g. "figandbloom.com/journal"
       photo    : image          | hero plate URL — same plate as the cover for continuity
     PALETTE       : ink #000000 ground · white #FFFFFF type · clay-tint #ECE6DF secondary
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000 url('{{photo}}') center/cover no-repeat;--mx:120px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.col{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 var(--mx)}
.logo{margin-top:9.5%;height:110px;width:auto}
.voice{margin-top:7.5%;font-family:CervI;font-size:44px;line-height:1.3;color:#FFFFFF}
.spacer{flex:1}
.cpill{display:inline-block;border:2px solid #ECE6DF;border-radius:999px;padding:26px 64px;font-family:Sans;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:#ECE6DF}
.url{margin-top:48px;font-family:Sans;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#ECE6DF}
.tail{flex:0 0 12%}
/* square feed — tighter run */
.stage.r1x1 .logo{height:96px}
.stage.r1x1 .voice{font-size:40px}
.stage.r1x1 .url{margin-top:40px}
/* story 9:16 — story-scale type, clear of UI zones */
.stage.r9x16 .logo{margin-top:14%}
.stage.r9x16 .voice{font-size:48px}
.stage.r9x16 .url{font-size:26px}
.stage.r9x16 .tail{flex-basis:20%}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="ov"></div>
  <div class="col">
    <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_white.png">
    <div class="voice">{{voice}}</div>
    <div class="spacer"></div>
    <span class="cpill">{{cta}}</span>
    <div class="url">{{url}}</div>
    <div class="tail"></div>
  </div>
</div></body></html>
