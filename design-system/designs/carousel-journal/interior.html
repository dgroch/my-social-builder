<!-- SLIDE interior | LANE journal | PHOTO optional (faint ground)
     TOKENS:
       kicker  : text  | masthead label, e.g. "The Journal" or "New Post"
       index   : text  | slide index, e.g. "02"
       label_1 : text  | section 1 pill label
       quote_1 : text  | section 1 sample message (include the quote marks)
       label_2 : text  | section 2 pill label
       quote_2 : text  | section 2 sample message
       label_3 : text  | section 3 pill label
       quote_3 : text  | section 3 sample message
       cta     : text  | footer CTA — "Next →" mid-deck, "Read the guide →" on the last interior
       photo   : image, optional | faint ground plate; omit for flat clay-tint
       voice   : text, optional  | Cervanttis voice line — its own block, never inline
     LEVERS:
       font : enum editorial|script | Font pairing — editorial = Lust pills + Neuzeit body; script = Neuzeit pills + Cervanttis body.
     NOTE        : exactly three sections by design — keeps the rhythm even. Do not add a fourth.
     PALETTE       : clay-tint #ECE6DF surface · ink #000000 type · clay #D8CCBE pill stroke
     TYPE          : font lever — editorial (default): Lust pills + Neuzeit body · script: Neuzeit pills + Cervanttis body
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}

/* Cervanttis descender clearance (shared script-role rule) — Cervanttis descends ~0.806em
   below the baseline (|glyph yMin| / 1000 upm, from cervanttis.ttf), well past its 1.25
   line-box (~0.52em of descent), so a descender (j g y p q) drops out of the voice line and
   onto the block beneath. Reserve the ~0.29em overflow below the script block; the next
   block’s own margin then stays the gap the layout intends. em-relative, so it holds at every
   ratio. See design-system/SYSTEM.md (the Cervanttis rule: its own line, breathing room). */
.stage{--cerv-descent-clear:0.29em}
.voice:not(:empty){padding-bottom:var(--cerv-descent-clear)}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#ECE6DF url('{{photo}}') center/cover no-repeat;
       --mx:88px;--my:88px}
.ov{position:absolute;inset:0;background:rgba(236,230,223,.93)}
.col{position:relative;height:100%;display:flex;flex-direction:column;padding:var(--my) var(--mx)}
.mast{display:flex;justify-content:space-between;align-items:baseline;font-family:Sans;font-size:26px;color:#000000}
.mast .kicker{letter-spacing:.25em;text-transform:uppercase}
.mast .idx{letter-spacing:.10em}
.mrule{height:2px;background:#000000;margin-top:40px}
.voice{margin-top:32px;font-family:CervI;font-size:36px;line-height:1.25;color:#000000}
.voice:empty{display:none}
.secs{flex:1;display:flex;flex-direction:column;min-height:0;padding:24px 0}
.sec{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pill{display:inline-block;border:2px solid #D8CCBE;border-radius:999px;padding:14px 34px;font-family:Lust;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#000000;background:rgba(236,230,223,.85)}
.q{margin-top:28px;font-family:Sans;font-size:34px;line-height:1.3;color:#000000;max-width:100%}
/* font lever — base above is `editorial` (Lust pills + Neuzeit body), the default and the
   unknown-value fallback; `script` restores the original Neuzeit pills + Cervanttis body.
   Casing per pairing: editorial sets Lust pills in Title Case and the Neuzeit body in
   sentence case (as authored); script keeps the original tracked-caps pills (base .pill). */
.stage[data-font="editorial"] .pill{text-transform:capitalize}
.stage[data-font="editorial"] .q{text-transform:none}
.stage[data-font="script"] .pill{font-family:Sans}
.stage[data-font="script"] .q{font-family:CervI}
.div{height:1px;background:#D8CCBE}
.foot{padding-top:0}
.frule{height:2px;background:#000000;margin-bottom:24px}
.footrow{display:flex;justify-content:space-between;align-items:flex-end}
.logo{height:58px;width:auto;display:block}
.read{font-family:Sans;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#000000}
/* square feed — tighter sections */
.stage.r1x1 .q{font-size:30px;margin-top:20px}
.stage.r1x1 .pill{padding:12px 28px}
.stage.r1x1 .secs{padding:16px 0}
/* story 9:16 — story-scale type */
.stage.r9x16{--my:160px}
.stage.r9x16 .mast{font-size:28px}
.stage.r9x16 .pill{font-size:26px}
.stage.r9x16 .q{font-size:40px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}" data-font="{{font}}">
  <div class="ov"></div>
  <div class="col">
    <div class="mast"><span class="kicker">{{kicker}}</span><span class="idx">{{index}}</span></div>
    <div class="mrule"></div>
    <div class="voice">{{voice}}</div>
    <div class="secs">
      <div class="sec"><span class="pill">{{label_1}}</span><div class="q">{{quote_1}}</div></div>
      <div class="div"></div>
      <div class="sec"><span class="pill">{{label_2}}</span><div class="q">{{quote_2}}</div></div>
      <div class="div"></div>
      <div class="sec"><span class="pill">{{label_3}}</span><div class="q">{{quote_3}}</div></div>
    </div>
    <div class="foot">
      <div class="frule"></div>
      <div class="footrow">
        <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_black.png">
        <div class="read">{{cta}}</div>
      </div>
    </div>
  </div>
</div></body></html>
