<!-- SLIDE interior | LANE journal | PHOTO optional (faint ground)
     TOKENS:
       kicker  : text  | masthead label, e.g. "The Journal" or "New Post"
       index   : text  | slide index, e.g. "02"
       label_1 : text  | section 1 pill label
       quote_1 : text  | section 1 sample message (include the quote marks)
       label_2 : text  | section 2 pill label
       quote_2 : text  | section 2 sample message
       label_3 : text  | section 3 pill label
       quote_3 : text  | section 3 sample message
       cta     : text  | footer CTA — "Next →" mid-deck, "Read the guide →" on the last interior
       photo   : image, optional | faint ground plate; omit for flat clay-tint
       voice   : text, optional  | Cervanttis voice line — its own block, never inline
     NOTE        : exactly three sections by design — keeps the rhythm even. Do not add a fourth.
     PALETTE       : clay-tint #ECE6DF surface · ink #000000 type · clay #D8CCBE pill stroke
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#ECE6DF url('{{photo}}') center/cover no-repeat}
.ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(236,230,223,.93)}
.kicker{position:absolute;left:88px;top:88px;font-family:Sans;font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:#000000}
.idx{position:absolute;right:88px;top:88px;font-family:Sans;font-size:12px;letter-spacing:.10em;color:#000000}
.mrule{position:absolute;left:88px;right:88px;top:142px;height:2px;background:#000000}
.frule{position:absolute;left:88px;right:88px;bottom:170px;height:2px;background:#000000}
.logo{position:absolute;left:88px;bottom:88px;height:58px}
.read{position:absolute;right:88px;bottom:96px;font-family:Sans;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#000000}
.sec{position:absolute;left:88px;right:88px;text-align:center}
.pill{display:inline-block;border:2px solid #D8CCBE;border-radius:999px;padding:13px 30px;font-family:Sans;font-size:12px;letter-spacing:.20em;text-transform:uppercase;color:#000000;background:rgba(236,230,223,.85)}
.q{margin-top:28px;font-family:CervI;font-size:22px;line-height:1.30;color:#000000}
.div{position:absolute;left:88px;right:88px;height:1px;background:#D8CCBE}
.voice{position:absolute;left:88px;right:88px;top:156px;font-family:CervI;font-style:normal;font-size:24px;line-height:1.3}</style></head><body>
<div class="stage">
  <div class="ov"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="idx">{{index}}</div>
  <div class="mrule"></div>
  <div class="sec" style="top:200px"><span class="pill">{{label_1}}</span><div class="q">{{quote_1}}</div></div>
  <div class="div" style="top:523px"></div>
  <div class="sec" style="top:543px"><span class="pill">{{label_2}}</span><div class="q">{{quote_2}}</div></div>
  <div class="div" style="top:866px"></div>
  <div class="sec" style="top:886px"><span class="pill">{{label_3}}</span><div class="q">{{quote_3}}</div></div>
  <div class="frule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_black.png">
  <div class="read">{{cta}}</div>
</div></body></html>
