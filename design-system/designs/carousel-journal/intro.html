<!-- SLIDE intro | LANE journal | PHOTO optional (faint ground)
     TOKENS:
       kicker  : text            | masthead label, e.g. "New Post"
       index   : text            | slide index, e.g. "01"
       lede    : text, markdown  | opening serif statement; *word* = italic accent; <br> for line breaks
       body    : text            | the story paragraph (sans body); <br><br> for a paragraph break
       lead_in : text            | italic-serif bridge into the examples, e.g. "A few to borrow, by moment —"
       cta     : text            | footer CTA, e.g. "Next →"
       photo   : image, optional | faint ground plate; omit for flat clay-tint
       voice   : text, optional  | Cervanttis voice line — its own block, never inline
     PALETTE       : clay-tint #ECE6DF surface · ink #000000 type · clay #D8CCBE accents
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#ECE6DF url('{{photo}}') center/cover no-repeat}
.ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(236,230,223,.93)}
.kicker{position:absolute;left:88px;top:88px;font-family:Sans;font-size:26px;letter-spacing:.25em;text-transform:uppercase;color:#000000}
.idx{position:absolute;right:88px;top:88px;font-family:Sans;font-size:26px;letter-spacing:.10em;color:#000000}
.mrule{position:absolute;left:88px;right:88px;top:160px;height:2px;background:#000000}
.lede{position:absolute;left:88px;top:268px;width:904px;font-family:Lust;font-size:52px;line-height:1.18;letter-spacing:-.5px;color:#000000}
.lede i{font-style:normal}
.body{position:absolute;left:88px;top:580px;width:856px;font-family:Sans;font-size:30px;line-height:1.5;color:#000000}
.lead{position:absolute;left:88px;bottom:248px;font-family:CervI;font-size:36px;color:#000000}
.frule{position:absolute;left:88px;right:88px;bottom:170px;height:2px;background:#000000}
.logo{position:absolute;left:88px;bottom:88px;height:58px}
.read{position:absolute;right:88px;bottom:96px;font-family:Sans;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#000000}
.voice{position:absolute;left:88px;right:88px;top:192px;font-family:CervI;font-style:normal;font-size:40px;line-height:1.25}</style></head><body>
<div class="stage">
  <div class="ov"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="idx">{{index}}</div>
  <div class="mrule"></div>
  <div class="lede">{{lede}}</div>
  <div class="body">{{body}}</div>
  <div class="lead">{{lead_in}}</div>
  <div class="frule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_black.png">
  <div class="read">{{cta}}</div>
</div></body></html>
