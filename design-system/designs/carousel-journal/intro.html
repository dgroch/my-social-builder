<!-- SLIDE intro | LANE journal | PHOTO optional (faint ground)
     TOKENS:
       kicker  : text            | masthead label, e.g. "New Post"
       index   : text            | slide index, e.g. "01"
       lede    : text, markdown  | opening serif statement; _word_ = Cervanttis italic emphasis (use rarely); *word* = legacy serif accent; <br> for line breaks
       body    : text            | the story paragraph (sans body); <br><br> for a paragraph break
       lead_in : text            | italic-serif bridge into the examples, e.g. "A few to borrow, by moment —"
       cta     : text            | footer CTA, e.g. "Next →"
       photo   : image, optional | faint ground plate; omit for flat clay-tint
       voice   : text, optional  | Cervanttis voice line — its own block, never inline
     PALETTE       : clay-tint #ECE6DF surface · ink #000000 type · clay #D8CCBE accents
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box;font-synthesis:none}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#ECE6DF url('{{photo}}') center/cover no-repeat;
       --mx:88px;--my:88px}
.ov{position:absolute;inset:0;background:rgba(236,230,223,.93)}
.col{position:relative;height:100%;display:flex;flex-direction:column;padding:var(--my) var(--mx)}
.mast{display:flex;justify-content:space-between;align-items:baseline;font-family:Sans;font-size:26px;color:#000000}
.mast .kicker{letter-spacing:.25em;text-transform:uppercase}
.mast .idx{letter-spacing:.10em}
.mrule{height:2px;background:#000000;margin-top:40px}
.voice{margin-top:32px;font-family:CervI;font-size:40px;line-height:1.25;color:#000000}
.voice:empty{display:none}
.lede{margin-top:96px;font-family:Lust;font-size:52px;line-height:1.18;letter-spacing:-.5px;color:#000000}
.lede i{font-style:normal}
.lede em{font-family:CervI;font-style:normal;font-weight:400}
.voice:not(:empty) + .lede{margin-top:40px}
.body{margin-top:64px;max-width:856px;font-family:Sans;font-size:30px;line-height:1.5;color:#000000}
.lead{margin-top:auto;padding-top:40px;margin-bottom:64px;font-family:CervI;font-size:36px;color:#000000}
.lead:empty{display:none;margin-bottom:0}
.foot{padding-top:0}
.frule{height:2px;background:#000000;margin-bottom:24px}
.footrow{display:flex;justify-content:space-between;align-items:flex-end}
.logo{height:58px;width:auto;display:block}
.read{font-family:Sans;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#000000}
/* square feed */
.stage.r1x1 .lede{font-size:46px;margin-top:64px}
.stage.r1x1 .voice:not(:empty) + .lede{margin-top:32px}
.stage.r1x1 .body{margin-top:40px}
.stage.r1x1 .lead{margin-bottom:40px}
/* story 9:16 */
.stage.r9x16{--my:160px}
.stage.r9x16 .mast{font-size:28px}
.stage.r9x16 .lede{font-size:64px}
.stage.r9x16 .body{font-size:32px}
.stage.r9x16 .voice{font-size:44px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="ov"></div>
  <div class="col">
    <div class="mast"><span class="kicker">{{kicker}}</span><span class="idx">{{index}}</span></div>
    <div class="mrule"></div>
    <div class="voice">{{voice}}</div>
    <div class="lede">{{lede}}</div>
    <div class="body">{{body}}</div>
    <div class="lead">{{lead_in}}</div>
    <div class="foot">
      <div class="frule"></div>
      <div class="footrow">
        <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_black.png">
        <div class="read">{{cta}}</div>
      </div>
    </div>
  </div>
</div></body></html>
