<!-- SLIDE photo-statement | LANE journal | PHOTO required
     TOKENS:
       kicker     : text            | sans kicker label above the rule, e.g. "The English Country Garden"
       headline   : text, markdown  | serif headline at the foot; wrap the turn word in _underscores_ for the Cervanttis italic emphasis (use rarely); *asterisks* = legacy serif accent; <br> for line breaks
       standfirst : text, optional  | a short sans line beneath the headline
       photo      : image           | full-bleed hero plate — a real named Fig & Bloom design
     VISUAL_ROLE  : photo-statement — a full-bleed plate that carries one line of voice
     FOCAL        : the plate; type is foot-anchored over a bottom scrim
     PAGINATION   : automatic "NN / NN" top-right (deck position) — not a token. No masthead.
     PALETTE       : white type on plate · clay #D8CCBE rule
     TYPE          : Lust display headline + Neuzeit Grotesk sans kicker/standfirst
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
*{margin:0;padding:0;box-sizing:border-box;font-synthesis:none}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000 url('{{photo}}') center/cover no-repeat;--mx:88px;--my:88px}
/* bottom scrim so foot-anchored white type reads on any plate; a faint top wash keeps pagination legible */
.ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 46%,rgba(0,0,0,.78) 100%)}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--my) var(--mx)}
.page{position:absolute;top:var(--my);right:var(--mx);font-family:Sans;font-size:24px;letter-spacing:.18em;color:rgba(255,255,255,.78)}
.kicker{font-family:Sans;font-size:26px;letter-spacing:.26em;text-transform:uppercase;color:#FFFFFF}
.krule{width:56px;height:2px;background:#D8CCBE;margin-top:20px}
.h{margin-top:28px;font-family:Lust;font-size:68px;line-height:1.04;letter-spacing:-1px;color:#FFFFFF}
.h i{font-style:normal}
.h em{font-family:CervI;font-style:normal;font-weight:400}
.standfirst{margin-top:24px;max-width:820px;font-family:Sans;font-size:28px;line-height:1.45;color:rgba(255,255,255,.84)}
.standfirst:empty{display:none}
/* square feed */
.stage.r1x1 .h{font-size:60px}
/* story 9:16 */
.stage.r9x16{--my:160px}
.stage.r9x16 .kicker{font-size:28px}
.stage.r9x16 .h{font-size:88px}
.stage.r9x16 .standfirst{font-size:32px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="ov"></div>
  <div class="page">{{PAGINATION}}</div>
  <div class="col">
    <div class="kicker">{{kicker}}</div>
    <div class="krule"></div>
    <div class="h">{{headline}}</div>
    <div class="standfirst">{{standfirst}}</div>
  </div>
</div></body></html>
