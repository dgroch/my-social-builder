<!-- SLIDE cover | LANE editorial | PHOTO required
     TOKENS:
       kicker     : text             | small-caps section label, e.g. "The journal" or "From the studio"
       quote      : text, markdown   | the editorial line, set large in Cervanttis; wrap a word in *asterisks* for italic accent; <br> for line breaks
       attribution: text             | small sans attribution under the quote, e.g. "Fig & Bloom — on hand-tied mornings"
       photo      : image            | real dark-plate photo from the Fig & Bloom asset library (rustic, hands, studio, in-stillness)
     voice     : text, optional   | Cervanttis voice line — its own block, never inline
     LEVERS:
       theme      : enum light|dark  | dark = white type on a dark photo (default); light = ink type on a clay-tint plate with the photo as a darker inset
     PALETTE       : ink #000000 ground · white #FFFFFF type · clay-tint #ECE6DF attribution
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
     LANE RULE     : No CTA on this lane. The quote is the message. If you need a CTA, use story-promo or story-overlay.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000 url('{{photo}}') center/cover no-repeat;
       --ink:#000000;--white:#FFFFFF;--clay-tint:#ECE6DF;--clay:#D8CCBE;--rule:#D8CCBE}
.stage.light{background:#ECE6DF url('{{photo}}') center/cover no-repeat}
.ov{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.55)}
.stage.light .ov{background:rgba(236,230,223,.80)}
.kicker{position:absolute;left:88px;top:560px;font-family:SansB;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--clay-tint)}
.quote{position:absolute;left:88px;right:88px;top:610px;font-family:Lust;font-size:52px;line-height:1.18;letter-spacing:-.5px;color:var(--white)}
.stage.light .quote{color:var(--ink)}
.quote i{font-style:normal}
.attr{position:absolute;left:88px;right:88px;top:1300px;font-family:Sans;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay-tint)}
.mark{position:absolute;left:88px;right:88px;bottom:200px;height:1px;background:var(--rule);opacity:.6}
.logo{position:absolute;left:88px;bottom:96px;height:48px}
.voice{position:absolute;left:88px;right:88px;top:600px;font-family:CervI;font-style:normal;font-size:24px;line-height:1.3}</style></head><body>
<div class="stage {{THEME_CLASS}}">
  <div class="ov"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="quote">{{quote}}</div>
  <div class="attr">{{attribution}}</div>
  <div class="mark"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_white.png">
</div></body></html>
