<!-- SLIDE linkout | LANE editorial | PHOTO none (seeds: Good Weekend link-in-bio closer)
     TOKENS:
       line : text           | the single action line, e.g. "Head to the link in bio for the full story."
       note : text, optional | a smaller sans line beneath, e.g. "New journal entries every week."
     LEVERS:
       surface : enum white|clay | flat field — white (seed default) or clay-tint
     PALETTE       : white #FFFFFF or clay-tint #ECE6DF field · ink #000000 type + logo
     TYPE          : Neuzeit Grotesk only — sans-only closer, logo carries the brand
     LANE RULE     : The only action beat in the editorial set. One line, the wordmark, nothing else. No photo, no serif, no chrome.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box;font-synthesis:none}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#FFFFFF;
       --ink:#000000;--clay-tint:#ECE6DF;--mx:88px;--logo:14%;--logoh:96px}
.stage.s-clay{background:#ECE6DF}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--mx)}
.line{font-family:SansB;font-size:36px;line-height:1.4;color:var(--ink);max-width:760px}
.note{margin-top:24px;font-family:Sans;font-size:26px;line-height:1.5;color:rgba(0,0,0,.62)}
.note:empty{display:none}
.logo{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--logo);height:var(--logoh);width:auto}
/* feed 4:5 / 1:1 */
.stage.r4x5{--logo:12%;--logoh:88px}
.stage.r4x5 .line{font-size:34px}
.stage.r1x1{--logo:11%;--logoh:80px}
.stage.r1x1 .line{font-size:32px}
/* landscape link card */
.stage.land{--mx:64px;--logo:11%;--logoh:64px}
.stage.land .line{font-size:28px;max-width:640px}
.stage.land .note{font-size:22px;margin-top:16px}
</style></head><body>
<div class="stage s-{{surface}} {{ORIENT}} {{RATIO_CLASS}}">
  <div class="wrap">
    <div class="line">{{line}}</div>
    <div class="note">{{note}}</div>
  </div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_black.png">
</div></body></html>
