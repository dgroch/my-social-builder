<!-- SLIDE intro | LANE gift | PHOTO required
     TOKENS:
       kicker   : text             | small-caps section label, e.g. "For the moment" or "Gifting"
       headline : text, markdown   | one-line setup for the gift moment; wrap a word in *asterisks* for an italic accent
       body     : text, optional   | one short paragraph beneath the headline; sets the scene, no urgency
       photo    : image            | real gift-being-prepared plate from the Fig & Bloom asset library
       cta      : text, optional   | lower-right link, e.g. "Next →"
     voice     : text, optional   | Cervanttis voice line — its own block, never inline
     LEVERS:
       theme    : enum light|dark  | light = ink type on a clean upper plate; dark = white type on a darkened plate
     PALETTE       : clay-tint #ECE6DF lower panel · ink #000000 type · clay #D8CCBE rules
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#ECE6DF;
       --ink:#000000;--char:#000000;--rule:#D8CCBE;--clay-tint:#ECE6DF;--clay:#D8CCBE}
.stage.dark{--ink:#FFFFFF;--char:#ECE6DF;--rule:#D8CCBE}
.plate{position:absolute;left:0;right:0;top:0;height:1056px;background:#000000 url('{{photo}}') center/cover no-repeat}
.plate::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:transparent}
.stage.dark .plate::after{background:rgba(0,0,0,.50)}
.kicker{position:absolute;left:88px;top:1124px;font-family:SansB;font-size:28px;letter-spacing:.25em;text-transform:uppercase;color:var(--char)}
.h{position:absolute;left:88px;right:88px;top:1256px;font-family:Lust;font-size:72px;line-height:1.05;letter-spacing:-0.5px;color:var(--ink)}
.h i{font-style:normal}
.body{position:absolute;left:88px;right:88px;top:1430px;font-family:Sans;font-size:30px;line-height:1.5;color:var(--char)}
.rule{position:absolute;left:88px;right:88px;bottom:160px;height:1px;background:var(--rule)}
.logo{position:absolute;left:88px;bottom:72px;height:52px}
.hint{position:absolute;right:88px;bottom:84px;font-family:Sans;font-size:24px;letter-spacing:.10em;color:var(--char);text-transform:uppercase}
.voice{position:absolute;left:88px;right:88px;top:1180px;font-family:CervI;font-style:normal;font-size:44px;line-height:1.25}</style></head><body>
<div class="stage {{THEME_CLASS}}">
  <div class="plate"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="h">{{headline}}</div>
  <div class="body">{{body}}</div>
  <div class="rule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
  <div class="hint">{{cta}}</div>
</div></body></html>
