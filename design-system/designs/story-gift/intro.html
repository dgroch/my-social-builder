<!-- SLIDE intro | LANE gift | PHOTO required
    TOKENS:
      kicker   : text             | small-caps section label, e.g. "For the moment" or "Gifting"
      headline : text, markdown   | one-line setup for the gift moment; wrap a word in *asterisks* for an italic accent
      body     : text, optional   | one short paragraph beneath the headline; sets the scene, no urgency
      photo    : image            | real gift-being-prepared plate from the Fig & Bloom asset library (wrapping, ribbon, hand-tied)
    LEVERS:
      theme    : enum light|dark  | light = ink type on a clean upper plate; dark = white type on a darkened plate
    VISUAL_ROLE  : scene-setter
    FOCAL        : the preparation plate (hands, ribbon, wrapping); copy sets the moment
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('{{ASSETS_BASE}}/fonts/pf_roman.ttf')}
@font-face{font-family:DispI;src:url('{{ASSETS_BASE}}/fonts/pf_italic.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/ws_400.ttf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/ws_600.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#faf7f3;
       --ink:#1a1612;--char:#332f2a;--rule:#c9bfb1}
.plate{position:absolute;left:0;right:0;top:0;height:1056px;background:#2a2622 url('{{photo}}') center/cover no-repeat}
.plate::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:transparent}
.stage.dark .plate::after{background:rgba(18,15,12,.50)}
.kicker{position:absolute;left:88px;top:1132px;font-family:SansB;font-size:24px;letter-spacing:.30em;text-transform:uppercase;color:var(--char)}
.h{position:absolute;left:88px;right:88px;top:1192px;font-family:Disp;font-size:84px;line-height:1.05;letter-spacing:-0.5px;color:var(--ink)}
.h i{font-family:DispI;font-style:normal}
.body{position:absolute;left:88px;right:88px;top:1472px;font-family:Sans;font-size:26px;line-height:1.55;color:var(--char)}
.rule{position:absolute;left:88px;right:88px;bottom:160px;height:1px;background:var(--rule)}
.logo{position:absolute;left:88px;bottom:72px;height:52px}
.hint{position:absolute;right:88px;bottom:84px;font-family:Sans;font-size:22px;letter-spacing:.10em;color:var(--char);text-transform:uppercase}
</style></head><body>
<div class="stage {{THEME_CLASS}}">
  <div class="plate"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="h">{{headline}}</div>
  <div class="body">{{body}}</div>
  <div class="rule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
  <div class="hint">{{cta}}</div>
</div></body></html>
