<!-- SLIDE cover | LANE promo | PHOTO required
    TOKENS:
      kicker     : text           | small-caps section label, e.g. "New in" or "Just arrived"
      headline   : text, markdown | product name line; wrap a word in *asterisks* for an italic accent
      subhead    : text, optional | one short product descriptor beneath the headline (variety, palette, vase)
      from_price : text, optional | "from $X" pill rendered as a small badge under the subhead
      cta        : text           | lower-right link, e.g. "See the range →"
      photo      : image          | real named product plate from the Fig & Bloom asset library
    LEVERS:
      theme      : enum light|dark | light = ink type on a clean upper plate; dark = white type on a darkened plate
    VISUAL_ROLE  : product announcement
    FOCAL        : the named product plate (owns the upper 62.5%); copy carries the context and price
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('{{ASSETS_BASE}}/fonts/pf_roman.ttf')}
@font-face{font-family:DispI;src:url('{{ASSETS_BASE}}/fonts/pf_italic.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/ws_400.ttf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/ws_600.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#faf7f3;
       --ink:#1a1612;--char:#332f2a;--rule:#c9bfb1;--panel:#faf7f3;--pill:#1a1612;--pill-ink:#faf7f3}
.plate{position:absolute;left:0;right:0;top:0;height:1200px;background:#2a2622 url('{{photo}}') center/cover no-repeat}
.plate::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:transparent}
.stage.dark .plate::after{background:rgba(18,15,12,.45)}
.kicker{position:absolute;left:88px;top:1276px;font-family:SansB;font-size:24px;letter-spacing:.30em;text-transform:uppercase;color:var(--char)}
.h{position:absolute;left:88px;right:88px;top:1336px;font-family:Disp;font-size:68px;line-height:1.05;letter-spacing:-0.5px;color:var(--ink)}
.h i{font-family:DispI;font-style:normal}
.sub{position:absolute;left:88px;right:88px;top:1528px;font-family:Sans;font-size:26px;line-height:1.5;color:var(--char)}
.pill{position:absolute;left:88px;top:1642px;display:inline-block;padding:14px 22px;background:var(--pill);color:var(--pill-ink);font-family:SansB;font-size:22px;letter-spacing:.08em;border-radius:999px}
.rule{position:absolute;left:88px;right:88px;bottom:160px;height:1px;background:var(--rule)}
.logo{position:absolute;left:88px;bottom:72px;height:52px}
.cta{position:absolute;right:88px;bottom:84px;font-family:SansB;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
</style></head><body>
<div class="stage {{THEME_CLASS}}">
  <div class="plate"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="h">{{headline}}</div>
  <div class="sub">{{subhead}}</div>
  <div class="pill">{{from_price}}</div>
  <div class="rule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
  <div class="cta">{{cta}}</div>
</div></body></html>
