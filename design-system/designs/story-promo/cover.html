<!-- SLIDE cover | LANE promo | PHOTO required
     TOKENS:
       kicker     : text           | small-caps section label, e.g. "New in" or "Just arrived"
       headline   : text, markdown | product name line; wrap a word in *asterisks* for an italic accent
       subhead    : text, optional | one short product descriptor beneath the headline
       from_price : text, optional | "from $X" pill rendered as a small badge under the subhead
       cta        : text           | lower-right link, e.g. "See the range →"
       photo      : image          | real named product plate from the Fig & Bloom asset library
     voice     : text, optional   | Cervanttis voice line — its own block, never inline
     LEVERS:
       theme      : enum light|dark | light = ink type on a clean upper plate; dark = white type on a darkened plate
     PALETTE       : tan-1 #F0E5D0 lower panel · ink #1A1612 type · tan-2 #B89A75 price pill
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#F0E5D0;
       --ink:#1A1612;--char:#1A1612;--rule:#B89A75;--pill:#1A1612;--pill-ink:#F0E5D0}
.stage.dark{--ink:#FFFFFF;--char:#F0E5D0;--rule:#B89A75;--pill:#F0E5D0;--pill-ink:#1A1612}
.plate{position:absolute;left:0;right:0;top:0;height:1200px;background:#1A1612 url('{{photo}}') center/cover no-repeat}
.plate::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:transparent}
.stage.dark .plate::after{background:rgba(26,22,18,.45)}
.kicker{position:absolute;left:88px;top:1276px;font-family:SansB;font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:var(--char)}
.h{position:absolute;left:88px;right:88px;top:1376px;font-family:Lust;font-size:48px;line-height:1.05;letter-spacing:-0.5px;color:var(--ink)}
.h i{font-style:normal}
.sub{position:absolute;left:88px;right:88px;top:1456px;font-family:Sans;font-size:16px;line-height:1.5;color:var(--char)}
.pill{position:absolute;left:88px;top:1512px;display:inline-block;padding:14px 22px;background:var(--pill);color:var(--pill-ink);font-family:SansB;font-size:12px;letter-spacing:.08em;border-radius:999px}
.rule{position:absolute;left:88px;right:88px;bottom:160px;height:1px;background:var(--rule)}
.logo{position:absolute;left:88px;bottom:72px;height:52px}
.cta{position:absolute;right:88px;bottom:84px;font-family:SansB;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.voice{position:absolute;left:88px;right:88px;top:1312px;font-family:CervI;font-style:normal;font-size:24px;line-height:1.3}</style></head><body>
<div class="stage {{THEME_CLASS}}">
  <div class="plate"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="h">{{headline}}</div>
  <div class="sub">{{subhead}}</div>
  <div class="pill">{{from_price}}</div>
  <div class="rule"></div>
  <img class="logo" src="{{ASSETS_BASE}}/assets/{{LOGO_FILE}}">
  <div class="cta">{{cta}}</div>
</div></body></html>
