<!-- SLIDE cover | LANE quote-soft | PHOTO required (soft-focus, right side)
     TOKENS:
       kicker   : text, markdown   | small-caps section label, e.g. "The studio"
       headline : text, markdown   | main serif statement, 2-4 lines, set left; <br> for controlled breaks
       body     : text, optional   | one short sans paragraph below the headline, AU English, calm register
       url      : text, optional   | short URL printed under the body, e.g. "figandbloom.com/journal"
       cta      : text             | the link-in-bio line, e.g. "Visit the link in bio →"
       photo    : image            | real soft-focus plate from the Fig & Bloom asset library (workshop, garden, room)
       voice    : text, optional   | Cervanttis voice line — its own block, never inline
     PALETTE       : clay-tint #ECE6DF left rail · ink #000000 type · clay #D8CCBE url
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
     LANE RULE     : The photo carries the mood; copy carries the message. Never invert. The rail is always clay-tint; the photo is always soft.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}

/* Cervanttis descender clearance (shared script-role rule) — Cervanttis descends ~0.806em
   below the baseline (|glyph yMin| / 1000 upm, from cervanttis.ttf), well past its 1.25
   line-box (~0.52em of descent), so a descender (j g y p q) drops out of the voice line and
   onto the block beneath. Reserve the ~0.29em overflow below the script block; the next
   block’s own margin then stays the gap the layout intends. em-relative, so it holds at every
   ratio. See design-system/SYSTEM.md (the Cervanttis rule: its own line, breathing room). */
.stage{--cerv-descent-clear:0.29em}
.voice:not(:empty){padding-bottom:var(--cerv-descent-clear)}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000;
       --ink:#000000;--white:#FFFFFF;--clay-tint:#ECE6DF;--clay:#D8CCBE;
       --rail:52%;--px:64px;--foot:96px}
.photo{position:absolute;left:39%;right:0;top:0;bottom:0;background:url('{{photo}}') center/cover no-repeat;filter:saturate(.95)contrast(1.02)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(236,230,223,1) 0%,rgba(236,230,223,0) 22%)}
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);background:#ECE6DF;
      display:flex;flex-direction:column;padding:0 var(--px) var(--foot)}
.top{flex:0 0 13.5%}
.kicker{font-family:SansB;font-size:26px;letter-spacing:.25em;text-transform:uppercase;color:rgba(0,0,0,.62)}
.kicker i{font-style:normal}
.voice{margin-top:24px;font-family:CervI;font-size:40px;line-height:1.25;color:#000000}
.voice:empty{display:none}
.head{margin-top:24px;font-family:Lust;font-size:52px;line-height:1.18;letter-spacing:-.5px;color:#000000}
.head i{font-style:normal}
.sp-a{flex:2 1 0}
.body{font-family:Sans;font-size:28px;line-height:1.5;color:#000000}
.body:empty{display:none}
.sp-b{flex:1.5 1 0}
.url{font-family:Sans;font-size:24px;letter-spacing:.12em;text-transform:lowercase;color:rgba(0,0,0,.55)}
.url:empty{display:none}
.sp-c{flex:1 1 0}
.cta{font-family:SansB;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#000000}
/* feed 4:5 / 1:1 — shorter rail run, feed-scale type */
.stage.r4x5{--rail:50%;--foot:88px}
.stage.r4x5 .top{flex-basis:10%}
.stage.r4x5 .head{font-size:48px}
.stage.r1x1{--rail:50%;--foot:88px}
.stage.r1x1 .top{flex-basis:9%}
.stage.r1x1 .head{font-size:42px}
.stage.r1x1 .voice{font-size:36px}
/* landscape link card — narrower rail, the photo carries the width */
.stage.land{--rail:46%;--px:48px;--foot:48px}
.stage.land .photo{left:34%}
.stage.land .top{flex-basis:9%}
.stage.land .kicker{font-size:22px}
.stage.land .voice{font-size:32px;margin-top:16px}
.stage.land .head{font-size:38px;margin-top:16px}
.stage.land .body{font-size:26px}
.stage.land .url{font-size:20px}
.stage.land .cta{font-size:22px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="photo"></div>
  <div class="rail">
    <div class="top"></div>
    <div class="kicker">{{kicker}}</div>
    <div class="voice">{{voice}}</div>
    <div class="head">{{headline}}</div>
    <div class="sp-a"></div>
    <div class="body">{{body}}</div>
    <div class="sp-b"></div>
    <div class="url">{{url}}</div>
    <div class="sp-c"></div>
    <div class="cta">{{cta}}</div>
  </div>
</div></body></html>
