<!-- SLIDE cover | LANE quote-soft | PHOTO required (soft-focus, right side)
     TOKENS:
       kicker   : text, markdown   | small-caps section label, e.g. "The studio"
       headline : text, markdown   | main serif statement (Cervanttis, italic accent via *word*); 2-4 lines, set left
       body     : text, optional   | one short sans paragraph below the headline, AU English, calm register
       url      : text, optional   | short URL printed under the body, e.g. "figandbloom.com/journal"
       cta      : text             | the link-in-bio line, e.g. "Visit the link in bio →"
       photo    : image            | real soft-focus plate from the Fig & Bloom asset library (workshop, garden, room)
     voice     : text, optional   | Cervanttis voice line — its own block, never inline
     LEVERS:
       theme    : enum light|dark  | light = ink on clay-tint with a soft photo inset; dark = white on a darkened photo with a clay-tint rail
     PALETTE       : clay-tint #ECE6DF left rail · ink #000000 type · clay #D8CCBE url
     TYPE          : Lust display + Cervanttis voice line + Neuzeit Grotesk sans
     LANE RULE     : The photo carries the mood; copy carries the message. Never invert. The rail is always clay-tint; the photo is always soft.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lust;src:url('{{ASSETS_BASE}}/fonts/Lust-Regular.otf')}
@font-face{font-family:CervI;src:url('{{ASSETS_BASE}}/fonts/cervanttis.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000;
       --ink:#000000;--white:#FFFFFF;--clay-tint:#ECE6DF;--clay:#D8CCBE}
.photo{position:absolute;left:420px;right:0;top:0;bottom:0;background:url('{{photo}}') center/cover no-repeat;filter:saturate(.95)contrast(1.02)}
.photo::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(236,230,223,1) 0%,rgba(236,230,223,0) 22%)}
.rail{position:absolute;left:0;top:0;bottom:0;width:560px;background:#ECE6DF}
.kicker{position:absolute;left:64px;top:280px;font-family:SansB;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#D8CCBE;right:540px}
.head{position:absolute;left:64px;right:540px;top:340px;font-family:Lust;font-size:36px;line-height:1.16;letter-spacing:-.5px;color:#000000}
.head i{font-style:normal}
.body{position:absolute;left:64px;right:540px;top:980px;font-family:Sans;font-size:16px;line-height:1.55;color:#000000}
.url{position:absolute;left:64px;top:1500px;font-family:Sans;font-size:12px;letter-spacing:.14em;text-transform:lowercase;color:#D8CCBE;right:540px}
.cta{position:absolute;left:64px;bottom:96px;font-family:SansB;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#000000;right:540px}
.voice{position:absolute;left:88px;right:88px;top:320px;font-family:CervI;font-style:normal;font-size:24px;line-height:1.3}</style></head><body>
<div class="stage">
  <div class="photo"></div>
  <div class="rail"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="voice">{{voice}}</div>
  <div class="head">{{headline}}</div>
  <div class="body">{{body}}</div>
  <div class="url">{{url}}</div>
  <div class="cta">{{cta}}</div>
</div></body></html>
