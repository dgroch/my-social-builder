<!-- SLIDE cover | LANE quote-soft | PHOTO required (soft-focus, right side)
     TOKENS:
       kicker   : text, markdown   | small-caps section label, e.g. "The studio"
       headline : text, markdown   | main serif statement (Cervanttis, italic accent via *word*); 2-4 lines, set left
       body     : text, optional   | one short sans paragraph below the headline, AU English, calm register
       url      : text, optional   | short URL printed under the body, e.g. "figandbloom.com/journal"
       cta      : text             | the link-in-bio line, e.g. "Visit the link in bio →"
       photo    : image            | real soft-focus plate from the Fig & Bloom asset library (workshop, garden, room)
     LEVERS:
       theme    : enum light|dark  | light = ink on tan-1 with a soft photo inset; dark = white on a darkened photo with a tan-1 rail
     PALETTE       : tan-1 #F0E5D0 left rail · ink #1A1612 type · tan-2 #B89A75 url
     TYPE          : Cervanttis (stand-in Playfair) display + Neuzeit Grotesk (stand-in Work Sans) sans
     LANE RULE     : The photo carries the mood; copy carries the message. Never invert. The rail is always tan-1; the photo is always soft.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('{{ASSETS_BASE}}/fonts/pf_roman.ttf')}
@font-face{font-family:DispI;src:url('{{ASSETS_BASE}}/fonts/pf_italic.ttf')}
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/ws_400.ttf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/ws_600.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#1A1612;
       --ink:#1A1612;--white:#FFFFFF;--tan-1:#F0E5D0;--tan-2:#B89A75}
.photo{position:absolute;left:420px;right:0;top:0;bottom:0;background:url('{{photo}}') center/cover no-repeat;filter:saturate(.95)contrast(1.02)}
.photo::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(240,229,208,1) 0%,rgba(240,229,208,0) 22%)}
.rail{position:absolute;left:0;top:0;bottom:0;width:560px;background:#F0E5D0}
.kicker{position:absolute;left:64px;top:280px;font-family:SansB;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#B89A75}
.head{position:absolute;left:64px;right:48px;top:340px;font-family:Disp;font-size:60px;line-height:1.16;letter-spacing:-.5px;color:#1A1612}
.head i{font-family:DispI;font-style:normal}
.body{position:absolute;left:64px;right:48px;top:980px;font-family:Sans;font-size:24px;line-height:1.55;color:#1A1612}
.url{position:absolute;left:64px;top:1500px;font-family:Sans;font-size:20px;letter-spacing:.14em;text-transform:lowercase;color:#B89A75}
.cta{position:absolute;left:64px;bottom:96px;font-family:SansB;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#1A1612}
</style></head><body>
<div class="stage">
  <div class="photo"></div>
  <div class="rail"></div>
  <div class="kicker">{{kicker}}</div>
  <div class="head">{{headline}}</div>
  <div class="body">{{body}}</div>
  <div class="url">{{url}}</div>
  <div class="cta">{{cta}}</div>
</div></body></html>
