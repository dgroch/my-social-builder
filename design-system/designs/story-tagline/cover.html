<!-- SLIDE cover | LANE tagline | PHOTO required (dark, moody)
     TOKENS:
       kicker   : text             | small-caps section label, e.g. "Gift edit" or "Studio notes"
       headline : text, sans       | the label line, set in Neuzeit Grotesk, all-caps; no italic accent
       subhead  : text, sans, optional | one short sans descriptor below the headline
       cta      : text             | lower-right link, e.g. "See the edit →"
       photo    : image            | real dark/moody plate from the Fig & Bloom asset library (hands, ingredients, surfaces)
     PALETTE       : ink #000000 ground · white #FFFFFF type · clay-tint #ECE6DF secondary
     TYPE          : Neuzeit Grotesk ONLY — no Lust / Cervanttis on this lane
     LANE RULE     : Sans-only. No serif. The lane is a label, not a statement. If you need a serif, use story-editorial.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Sans;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Lig.otf')}
@font-face{font-family:SansB;src:url('{{ASSETS_BASE}}/fonts/NeuzeitGro-Bol.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
.stage{position:relative;width:{{W}}px;height:{{H}}px;background:#000000 url('{{photo}}') center/cover no-repeat;
       --ink:#000000;--white:#FFFFFF;--clay-tint:#ECE6DF;--clay:#D8CCBE;--rule:#FFFFFF;
       --mx:88px;--foot:96px;
       --tsh:0 2px 6px rgba(0,0,0,.28),0 10px 36px rgba(0,0,0,.32)}
/* seed-faithful plate treatment: 10% ink mask + subtle text shadow (Good Weekend kit) */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.10)}
.col{position:relative;height:100%;display:flex;flex-direction:column;padding:0 var(--mx);text-shadow:var(--tsh)}
.top{flex:1 1 58%}
.kicker{font-family:SansB;font-size:28px;letter-spacing:.25em;text-transform:uppercase;color:var(--clay-tint)}
.h{margin-top:24px;font-family:SansB;font-size:84px;line-height:1.05;letter-spacing:-.5px;color:var(--white);text-transform:uppercase}
.sub{margin-top:24px;font-family:Sans;font-size:30px;line-height:1.45;color:var(--clay-tint)}
.sub:empty{display:none}
.foot{margin-top:auto;padding-top:96px;padding-bottom:var(--foot)}
.rule{height:1px;background:var(--rule);opacity:.5;margin-bottom:48px}
.footrow{display:flex;justify-content:space-between;align-items:flex-end}
.logo{height:48px;width:auto;display:block}
.cta{font-family:SansB;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--white)}
/* feed 4:5 / 1:1 */
.stage.r4x5{--foot:88px}
.stage.r4x5 .top{flex-basis:48%}
.stage.r4x5 .h{font-size:68px}
.stage.r4x5 .kicker{font-size:26px}
.stage.r4x5 .foot{padding-top:64px}
.stage.r4x5 .rule{margin-bottom:40px}
.stage.r1x1{--foot:88px}
.stage.r1x1 .top{flex-basis:42%}
.stage.r1x1 .h{font-size:60px}
.stage.r1x1 .kicker{font-size:26px}
.stage.r1x1 .foot{padding-top:64px}
.stage.r1x1 .rule{margin-bottom:40px}
/* landscape link card */
.stage.land{--mx:64px;--foot:48px}
.stage.land .top{flex-basis:30%}
.stage.land .h{font-size:48px}
.stage.land .kicker{font-size:22px}
.stage.land .sub{font-size:26px;margin-top:16px}
.stage.land .foot{padding-top:48px}
.stage.land .rule{margin-bottom:24px}
.stage.land .logo{height:40px}
.stage.land .cta{font-size:22px}
</style></head><body>
<div class="stage {{ORIENT}} {{RATIO_CLASS}}">
  <div class="ov"></div>
  <div class="col">
    <div class="top"></div>
    <div class="kicker">{{kicker}}</div>
    <div class="h">{{headline}}</div>
    <div class="sub">{{subhead}}</div>
    <div class="foot">
      <div class="rule"></div>
      <div class="footrow">
        <img class="logo" src="{{ASSETS_BASE}}/assets/logo_h_white.png">
        <div class="cta">{{cta}}</div>
      </div>
    </div>
  </div>
</div></body></html>
